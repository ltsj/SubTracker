name: Sync Upstream Lite

on:
  workflow_dispatch:
  schedule:
    - cron: "15 20 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ltsj/SubTracker'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: lite
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Smile-QWQ/SubTracker.git
          git fetch upstream lite

      - name: Merge upstream lite
        id: merge
        shell: bash
        run: |
          upstream_sha="$(git rev-parse upstream/lite)"
          current_sha="$(git rev-parse HEAD)"

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream lite."
            exit 0
          fi

          git merge --no-edit upstream/lite
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push merged changes
        if: steps.merge.outputs.updated == 'true'
        run: git push origin HEAD:lite

      - name: Trigger deploy
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Lite CI and Deploy" --ref lite
